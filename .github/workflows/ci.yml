name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  check-and-build:
    runs-on: ubuntu-latest
    env:
      NOTION_API_KEY: ${{ secrets.NOTION_API_KEY }}
      NOTION_DATABASE_ID: ${{ secrets.NOTION_DATABASE_ID }}
      # 관리자 목록의 공개 링크 복사(Task 015)용 선택 값 — 미등록 상태로도 빌드는 통과한다
      # (src/lib/env.ts에서 optional, buildInvoicePublicUrl이 요청 origin으로 폴백).
      NEXT_PUBLIC_SITE_URL: ${{ secrets.NEXT_PUBLIC_SITE_URL }}
      # 관리자 인증(Task 018) - src/lib/env.ts에서 필수값이라 없으면 빌드가 실패한다.
      ADMIN_PASSWORD_HASH: ${{ secrets.ADMIN_PASSWORD_HASH }}
      ADMIN_SESSION_SECRET: ${{ secrets.ADMIN_SESSION_SECRET }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - run: npm run check-all

      - run: npm run build
